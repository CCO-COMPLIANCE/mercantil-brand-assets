<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mercantil One — Noticias</title>
<link rel="icon" href="../png/web/favicon-32.png">
<style>
  :root{
    --red:#FE0000; --bg:#000; --text:#fff; --muted:#8e8e93; --line:#2c2c2e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);overflow:hidden;
       font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}

  /* ── App shell (Mercantil One home, behind the sheet) ── */
  .app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px}
  .topbar img{height:26px}
  .bell{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:#1c1c1e;
        display:grid;place-items:center}
  .bell svg{width:20px;height:20px}
  .bell .badge{position:absolute;top:4px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
               background:var(--red);font-size:11px;font-weight:700;line-height:18px;text-align:center}
  .bell .badge[hidden]{display:none}
  .who{padding:0 20px 8px;color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
  .who select{background:#1c1c1e;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:inherit}
  .who a{color:var(--muted);margin-left:auto}
  .home{flex:1;overflow:auto;padding:4px 20px 40px}
  .home h1{font-size:30px;letter-spacing:-.02em;margin:10px 0 18px}
  .row{display:grid;grid-template-columns:1fr 92px auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .row .k{font-size:19px;font-weight:700;letter-spacing:-.01em}
  .row .s{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row svg{width:92px;height:34px}
  .row .r{text-align:right}
  .row .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
  .pill{background:#34c759;border-radius:7px;padding:3px 8px;font-size:15px;font-weight:600;margin-top:4px;
        display:inline-block;min-width:72px;text-align:right;font-variant-numeric:tabular-nums}
  .pill.down{background:#ff3b30}

  /* ── Bottom sheet ── */
  /* Floating glass window, like the Stocks news sheet: the screen behind stays visible, blurred. */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.12);opacity:0;pointer-events:none;transition:opacity .3s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));width:min(540px,calc(100% - 28px));
         max-height:calc(100% - 96px);display:flex;flex-direction:column;border-radius:42px;isolation:isolate;
         transform:translate(-50%,calc(100% + 40px)) scale(.96);opacity:0;
         transition:transform .5s cubic-bezier(.22,1.2,.36,1),opacity .25s;
         box-shadow:0 30px 80px rgba(0,0,0,.55),0 2px 10px rgba(0,0,0,.35)}
  .sheet.on{transform:translate(-50%,0) scale(1);opacity:1}
  .sheet.drag{transition:none}
  /* Frosted body. */
  .sheet::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;
         background:linear-gradient(180deg,rgba(58,58,62,.3),rgba(28,28,30,.4));
         -webkit-backdrop-filter:blur(22px) saturate(2) brightness(.85);backdrop-filter:blur(22px) saturate(2) brightness(.85)}
  /* Glass rim: thin, less blurred band that lets the colors behind bleed through the edge. */
  .sheet::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;padding:7px;pointer-events:none;
         -webkit-backdrop-filter:blur(3px) saturate(2.6);backdrop-filter:blur(3px) saturate(2.6);
         box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.1);
         -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
         mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
  .grab{padding:12px 0 2px;display:grid;place-items:center;touch-action:none;cursor:grab}
  .grab span{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.32)}
  .sheet-head{padding:14px 30px 20px}
  .sheet-head h2{margin:0;font-size:34px;line-height:1.08;letter-spacing:-.025em;font-weight:700}
  .sheet-head .from{color:rgba(235,235,245,.6);font-size:20px;font-weight:600;display:flex;align-items:center;gap:6px;margin-top:4px}
  .sheet-head .from img{height:19px;opacity:.85}
  .list{overflow:auto;padding:0 18px 4px;display:flex;flex-direction:column;gap:12px}
  .sheet-foot{padding:16px 30px 24px;display:flex;justify-content:space-between;align-items:center}
  .sheet-foot img{height:22px;opacity:.45}
  .later{background:none;border:0;color:rgba(235,235,245,.6);font-size:15px;font-weight:600;padding:6px 0}

  .card{display:grid;grid-template-columns:1fr 120px;gap:16px;width:100%;text-align:left;border:0;
        background:rgba(255,255,255,.075);border-radius:28px;padding:20px 20px 16px;
        transition:background .15s,transform .15s}
  .card:hover{background:rgba(255,255,255,.11)}
  .card:active{transform:scale(.98)}
  .card .src{display:flex;align-items:center;gap:8px;height:22px}
  .card .src img{height:20px}
  .card .src .cat{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;
                  background:var(--red);border-radius:5px;padding:2px 6px}
  .card .t{font-size:22px;font-weight:600;line-height:1.2;letter-spacing:-.015em;margin:12px 0 0}
  .card .sum{color:rgba(235,235,245,.6);font-size:15px;line-height:1.35;margin-top:6px;
             display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .meta{grid-column:1/-1;color:rgba(235,235,245,.6);font-size:15px;display:flex;justify-content:space-between;align-items:center;margin-top:6px}
  .card .more{letter-spacing:2px;font-weight:900;font-size:17px;color:rgba(235,235,245,.75)}
  .thumb{width:120px;height:120px;border-radius:16px;overflow:hidden;align-self:start;background:#1c1c1e}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .tile{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;
        background:linear-gradient(150deg,#ff2d2d 0%,#b30000 100%);text-align:center;padding:8px}
  .tile img{height:26px;width:auto}
  .tile b{font-size:13px;line-height:1.15;letter-spacing:.01em;white-space:nowrap}

  /* ── Reader ── */
  .reader{position:fixed;inset:0;background:#000;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
          overflow:auto;z-index:5}
  .reader.on{transform:none}
  .reader-in{max-width:640px;margin:0 auto;padding:0 0 110px}
  .cover{height:260px;background:#1c1c1e;position:relative}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover .tile img{height:56px;width:auto;object-fit:contain}
  .cover .tile b{font-size:22px}
  .close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:0;
         background:rgba(0,0,0,.55);display:grid;place-items:center;font-size:20px;line-height:1}
  .article{padding:22px 22px 0}
  .article .src{color:var(--red);font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .article h1{font-size:32px;line-height:1.12;letter-spacing:-.02em;margin:8px 0 14px}
  .facts{display:flex;flex-direction:column;gap:8px;margin:0 0 18px;padding:14px 16px;background:#1c1c1e;border-radius:14px}
  .facts div{display:flex;gap:10px;font-size:15px}
  .facts span:first-child{color:var(--muted);min-width:78px}
  .body{font-size:17px;line-height:1.55;color:#e5e5ea;white-space:pre-line}
  .byline{color:var(--muted);font-size:14px;margin-top:22px}
  .done{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(600px,calc(100% - 40px));
        background:var(--red);border:0;border-radius:14px;padding:15px;font-weight:700;font-size:17px}

  @media (prefers-reduced-motion:reduce){.sheet,.reader,.scrim{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <img src="../svg/mercantil-lockup-inverse.svg" alt="Mercantil">
    <button class="bell" id="bell" aria-label="Noticias">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="badge" id="badge" hidden></span>
    </button>
  </div>
  <div class="who">
    Asesor (demo):
    <select id="advisor"></select>
    <a href="admin.html">Admin →</a>
  </div>
  <main class="home">
    <h1>Hola, <span id="hello"></span></h1>
    <div id="rows"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="grab" id="grab"><span></span></div>
  <div class="sheet-head">
    <h2 id="sheet-title">Noticias</h2>
    <div class="from">De <img src="../svg/mercantil-isotipo-red.svg" alt=""> Mercantil</div>
  </div>
  <div class="list" id="list"></div>
  <div class="sheet-foot">
    <img src="../svg/mercantil-lockup-white.svg" alt="Mercantil">
    <button class="later" id="later">Más tarde</button>
  </div>
</section>

<article class="reader" id="reader" aria-modal="true" role="dialog">
  <div class="reader-in" id="reader-in"></div>
  <button class="done" id="done">Entendido</button>
</article>

<script src="news-store.js"></script>
<script src="news-ui.js"></script>
<script>
(function () {
  'use strict';
  var esc = NewsUI.esc;
  var $ = function (id) { return document.getElementById(id); };
  var advisorSel = $('advisor'), sheet = $('sheet'), scrim = $('scrim'), reader = $('reader');
  var advisorId;

  // Demo home: advisor KPIs as a Stocks-style list.
  var KPIS = [
    ['Cartera', 'Clientes activos', '128', '+4', [3,4,4,5,5,6,5,7,7,8]],
    ['Pipeline', 'Oportunidades abiertas', '23', '+2', [5,4,6,5,7,6,8,7,8,9]],
    ['Senderos', 'Unidades disponibles', '37', '−3', [9,9,8,8,7,7,6,6,5,5]],
    ['Citas', 'Esta semana', '9', '+1', [2,3,3,2,4,5,4,5,6,6]],
    ['Cierres', 'Mes en curso', '4', '+4', [1,1,2,2,2,3,3,3,4,4]],
    ['Comisiones', 'Mes en curso (US$)', '18,450', '+12.4%', [4,5,5,6,5,7,8,7,9,10]]
  ];
  $('rows').innerHTML = KPIS.map(function (k) {
    var pts = k[4], max = Math.max.apply(null, pts), min = Math.min.apply(null, pts), down = k[3].charAt(0) === '−';
    var d = pts.map(function (v, i) {
      return (i ? 'L' : 'M') + (i * 92 / (pts.length - 1)).toFixed(1) + ' ' + (30 - (v - min) / ((max - min) || 1) * 26).toFixed(1);
    }).join(' ');
    var c = down ? '#ff3b30' : '#34c759';
    return '<div class="row"><div><div class="k">' + k[0] + '</div><div class="s">' + k[1] + '</div></div>' +
      '<svg viewBox="0 0 92 34" aria-hidden="true"><path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="2" stroke-linejoin="round"/>' +
      '<line x1="0" y1="20" x2="92" y2="20" stroke="' + c + '" stroke-dasharray="2 3" opacity=".5"/></svg>' +
      '<div class="r"><div class="v">' + k[2] + '</div><span class="pill' + (down ? ' down' : '') + '">' + k[3] + '</span></div></div>';
  }).join('');

  NewsStore.advisors().forEach(function (a) {
    advisorSel.add(new Option(a.name, a.id));
  });
  try { advisorSel.value = localStorage.getItem('mo.news.demoAdvisor') || advisorSel.value; } catch (e) {}

  function cover(n, big) {
    if (n.imageUrl) return '<img src="' + esc(n.imageUrl) + '" alt="">';
    return '<div class="tile"><img src="../svg/mercantil-isotipo-white.svg" alt="">' +
      (n.eventStart ? '<b>' + esc(NewsUI.eventBadge(n.eventStart, n.eventEnd)) + '</b>' : '') + '</div>';
  }

  function render() {
    var items = NewsStore.unreadFor(advisorId);
    $('badge').hidden = !items.length;
    $('badge').textContent = items.length;
    $('list').innerHTML = items.map(function (n) {
      return '<button class="card" data-id="' + esc(n.id) + '">' +
        '<div><div class="src"><img src="../svg/mercantil-lockup-white.svg" alt="Mercantil">' +
        (n.category ? '<span class="cat">' + esc(n.category) + '</span>' : '') + '</div>' +
        '<div class="t">' + esc(n.title) + '</div>' +
        (n.summary ? '<div class="sum">' + esc(n.summary) + '</div>' : '') + '</div>' +
        '<div class="thumb">' + cover(n) + '</div>' +
        '<div class="meta"><span>' + esc(NewsUI.timeAgo(n.publishAt || n.createdAt)) +
        (n.author ? ' · ' + esc(n.author) : '') + '</span><span class="more" aria-hidden="true">•••</span></div>' +
        '</button>';
    }).join('');
    return items.length;
  }

  function openSheet() { if (render()) { sheet.classList.add('on'); scrim.classList.add('on'); } }
  function closeSheet() { sheet.classList.remove('on'); scrim.classList.remove('on'); sheet.style.transform = ''; }

  function openReader(id) {
    var n = NewsStore.get(id);
    if (!n) return;
    // Opening the article counts as read: it will not show up again for this advisor.
    NewsStore.markRead(id, advisorId);
    var facts = '';
    if (n.eventStart) facts += '<div><span>Fechas</span><span>' + esc(NewsUI.eventRange(n.eventStart, n.eventEnd)) + '</span></div>';
    if (n.location) facts += '<div><span>Lugar</span><span>' + esc(n.location) + '</span></div>';
    $('reader-in').innerHTML =
      '<div class="cover">' + cover(n, true) + '<button class="close" id="x" aria-label="Cerrar">×</button></div>' +
      '<div class="article"><div class="src">' + esc(n.category || 'Mercantil') + '</div>' +
      '<h1>' + esc(n.title) + '</h1>' +
      (facts ? '<div class="facts">' + facts + '</div>' : '') +
      '<div class="body">' + esc(n.body || n.summary) + '</div>' +
      '<div class="byline">' + esc(NewsUI.timeAgo(n.publishAt || n.createdAt)) + (n.author ? ' · ' + esc(n.author) : '') + '</div></div>';
    $('x').onclick = closeReader;
    reader.scrollTop = 0;
    reader.classList.add('on');
  }

  function closeReader() {
    reader.classList.remove('on');
    if (!render()) closeSheet();
  }

  function setAdvisor(id) {
    advisorId = id;
    try { localStorage.setItem('mo.news.demoAdvisor', id); } catch (e) {}
    $('hello').textContent = advisorSel.options[advisorSel.selectedIndex].text.split(' ')[0];
    closeSheet();
    // Simulates the login: unread news are the first thing the advisor sees.
    setTimeout(openSheet, 350);
  }

  $('list').addEventListener('click', function (e) {
    var card = e.target.closest('.card');
    if (card) openReader(card.getAttribute('data-id'));
  });
  $('done').onclick = closeReader;
  $('later').onclick = closeSheet;
  scrim.onclick = closeSheet;
  $('bell').onclick = openSheet;
  advisorSel.onchange = function () { setAdvisor(advisorSel.value); };
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (reader.classList.contains('on')) closeReader(); else closeSheet();
  });

  // Drag the grabber down to dismiss.
  var startY = null;
  $('grab').addEventListener('pointerdown', function (e) { startY = e.clientY; $('grab').setPointerCapture(e.pointerId); sheet.classList.add('drag'); });
  $('grab').addEventListener('pointermove', function (e) {
    if (startY === null) return;
    sheet.style.transform = 'translate(-50%,' + Math.max(0, e.clientY - startY) + 'px)';
  });
  $('grab').addEventListener('pointerup', function (e) {
    var dy = e.clientY - startY;
    startY = null;
    sheet.classList.remove('drag');
    sheet.style.transform = '';
    if (dy > 90) closeSheet();
  });

  // Other tabs (e.g. admin) publishing news.
  window.addEventListener('storage', function () {
    if (reader.classList.contains('on')) return;
    if (!render()) closeSheet(); else if (!sheet.classList.contains('on')) openSheet();
  });

  setAdvisor(advisorSel.value);
})();
</script>
</body>
</html>
